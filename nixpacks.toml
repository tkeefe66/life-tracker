providers = ["python"]

[phases.setup]
# postgresql: provides the pg_dump binary jobs/backup_db.py shells out to.
# Deliberately the unversioned alias, not a pinned major (e.g. postgresql_17)
# — an explicit major that doesn't resolve in the pinned nixpkgs revision
# fails the whole setup phase and breaks the entire deploy, which is strictly
# worse than a pg_dump/server version mismatch (that only breaks backups).
# pg_dump refusing to dump from a server newer than itself is instead
# detected at runtime: jobs/backup_db.py inspects pg_dump's stderr for the
# "server version ... ; pg_dump version ..." wording and records a distinct
# "error: pg_dump version mismatch" status (services/safe_status.py) so it's
# diagnosable from the Settings screen rather than failing the deploy.
nixPkgs = ["python311", "gcc", "nodejs_20", "postgresql"]

[phases.build]
cmds = ["cd frontend && npm ci && npm run build"]
